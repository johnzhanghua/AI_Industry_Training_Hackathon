# LoRA (PEFT) fine-tuning of /models/Llama-3.1-Nemotron-Nano-8B-v1 for financial answer synthesis
# over the AFR / ASX / RBA corpus, on a single DGX Spark GPU.
#
# Generated by src/scripts/03-fine-tuning.py — edit that, not this file.
#
# Hyperparameters follow the handout's confirmed baseline:
#   LORA_RANK 32 | LR 5.0e-5 | MAX_SEQ_LEN 512
#   MAX_STEPS 100 | CKPT_EVERY 20
#   BATCH_SIZE 2 x GRAD_ACCUM 4 = effective 8
# lr 1e-4 spikes the loss at warmup, and seq > 512 OOMs on one node — do not raise either.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 8
  local_batch_size: 2
  num_epochs: 1
  max_steps: 100
  val_every_steps: 20
  ckpt_every_steps: 20

dist_env:
  backend: nccl
  timeout_minutes: 20

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /models/Llama-3.1-Nemotron-Nano-8B-v1
  torch_dtype: bf16

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/checkpoints
  model_save_format: safetensors
  save_consolidated: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: '*_proj'
  dim: 32
  alpha: 32
  dropout: 0.1
  use_triton: true

distributed:
  # AutoModel instantiates this block like any other, so it needs a _target_ —
  # a bare `strategy: fsdp2` fails with "No _target_ found to instantiate".
  # dp_size must be `null`, not `none`: YAML reads `none` as the string "none".
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  dp_size: null
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: /workspace/data/train.jsonl
  split: train
  column_mapping:
    question: prompt
    answer: completion
  seq_length: 512
  answer_only_loss_mask: true
  padding: do_not_pad
  truncation: longest_first

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: /workspace/data/val.jsonl
  split: validation
  column_mapping:
    question: prompt
    answer: completion
  seq_length: 512
  answer_only_loss_mask: true
  padding: do_not_pad
  truncation: longest_first

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.Adam
  lr: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
